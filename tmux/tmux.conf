set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 10000

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Windows
bind -n M-N new-window -c "#{pane_current_path}"
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded"

# Pane navigation
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# Window navigation
bind -n M-p previous-window
bind -n M-n next-window

# Kill
bind -n M-q kill-window
# bind -n M-q kill-pane

# Tree
bind -n M-Space choose-tree -Zw

# Splits
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"

# Vi mode
setw -g mode-keys vi

# Status bar
set -g status-position bottom
set -g status-left ""
set -g status-right ""

set -g status-style "bg=default,fg=white"

set -g window-status-format "#[fg=white,bg=default]#W"
set -g window-status-current-format "#[fg=red,bg=default,bold]#W"

# Pane borders
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=red"
set -g pane-border-lines heavy
